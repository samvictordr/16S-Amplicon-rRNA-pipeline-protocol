# pipeline.conf — Default configuration for the eDNA metabarcoding pipeline
#
# Copy this file and edit it for your sample, then pass it with:
#   ./edna.sh --config my_sample.conf
#
# CLI flags (e.g. --trunc-f 220) override values in this file.

# EBI accession ID (determines download URLs automatically)
#
# ERR3444605 is a human nasopharyngeal 16S rRNA V4 amplicon run (2x251 bp MiSeq)
# from ENA study PRJEB33591 / ERP116397, "Outer Ear and Nasopharynx as Sources of
# the Middle Ear Microbiome during Otitis Media with Effusion". Sample D-003-ANS.
# It is NOT marine eDNA and NOT 18S — earlier revisions of this repo said so in
# error. See datasets.tsv for the full benchmarking set.
SAMPLE_ID="ERR3444605"

# Sample label written into the QIIME 2 manifest (can be anything descriptive)
SAMPLE_NAME="nasopharynx-D003"

# QIIME 2 conda environment name.
# Set to "current" to use whichever environment is already activated, which is
# the portable choice when the env name differs between machines.
QIIME_ENV="current"

# DADA2 truncation lengths (bp) for forward and reverse reads
TRUNC_LEN_F=240
TRUNC_LEN_R=240

# Number of threads for DADA2 denoising and classification (0 = all available cores)
THREADS=1

# Pre-trained SILVA Naive Bayes classifier
#
# MUST match the amplicon's primer region. The reads here are 515F-806R (V4,
# ~253 bp), so the classifier must be the 515F-806R one. The URL previously set
# here served a 341F-805R (V3-V4) classifier under a 515-806 filename, which
# silently degraded every taxonomic assignment in the repo.
#
# Official QIIME 2 artifact (SILVA 138 99% OTUs, 515F-806R, 141 MB):
CLASSIFIER_URL="https://data.qiime2.org/2024.2/common/silva-138-99-515-806-nb-classifier.qza"
CLASSIFIER_FILE="silva-138-99-515-806-nb-classifier.qza"
#
# If QIIME 2 rejects the above with a scikit-learn version mismatch, rebuild it
# locally against your own environment: bash scripts/build_classifier.sh

# Output directory (default: current working directory)
OUTPUT_DIR="."

# Benchmarking mode: off, instrument, slurm
# BENCHMARK_MODE="off"

# Directory for benchmark CSV outputs
# BENCHMARK_DIR="benchmarks"

# SLURM partition for job submission
# SLURM_PARTITION="main"
